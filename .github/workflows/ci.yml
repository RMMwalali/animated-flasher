name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ngina
          POSTGRES_PASSWORD: ngina
          POSTGRES_DB: ngina
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ngina" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ngina:ngina@localhost:5432/ngina
      SITE_URL: http://localhost:3100
      PAYLOAD_PUSH: 'false'
      ENQUIRY_RATE_LIMIT: '100'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate throwaway secrets for this run
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "SEED_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Database migrations
        run: pnpm migrate
      - name: Seed sample data
        run: pnpm seed
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
